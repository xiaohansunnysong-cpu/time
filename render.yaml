services:
  - type: web
    name: shijian-manghe
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://shijian-manghe-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: shijian-manghe-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
